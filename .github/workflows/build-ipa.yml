name: Build iOS IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build Fight Night Champion iOS (ARM64)
    runs-on: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 16 for C++23 Support
        run: |
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "${XCODE_16}" ]; then
            echo "[CI] Selecting Xcode 16 at ${XCODE_16}..."
            sudo xcode-select -s "${XCODE_16}"
          else
            echo "[CI] Xcode 16 not found by glob, checking available Xcode apps:"
            ls -d /Applications/Xcode*.app || true
          fi
          echo "[CI] Active Xcode version:"
          xcodebuild -version
          xcrun --sdk iphoneos --find clang

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Cache Homebrew Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew
            /usr/local/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install Build Tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Cache ReXGlue iOS SDK & MoltenVK
        uses: actions/cache@v4
        id: cache-sdk
        with:
          path: |
            ${{ github.workspace }}/../rexglue-sdk-ios
            ~/.fnc-ios
          key: ${{ runner.os }}-rexglue-sdk-v0.10.0-mvk-1.4.1-fnc-p19

      - name: Setup AppIcon & Assets Catalog
        run: |
          python3 tools/generate_appicon.py

      - name: Extract Shaders & Generate Seed Pipeline Cache
        run: |
          python3 tools/extract_shaders.py

      - name: Restore or Prepare Game Codegen (PowerPC to C++)
        run: |
          mkdir -p generated/default
          python3 tools/generate_code.py --unpack-cache

      - name: Prepare ReXGlue iOS SDK
        run: |
          python3 tools/ios/prepare_sdk.py --sdk "../rexglue-sdk-ios"
          if [ -d "../rexglue-sdk-ios" ]; then
            (cd ../rexglue-sdk-ios && git tag -f v0.10.0 HEAD 2>/dev/null || true)
          fi

      - name: Verify Codegen (Fail-Fast)
        run: |
          python3 tools/verify_codegen.py

      - name: "Pre-Flight Check: Verify Argv & Post-Launcher Handoff (ASan/UBSan)"
        run: |
          echo "[CI] Compiling and running host argv deduplication and handoff test with ASan/UBSan..."
          clang++ -std=c++20 -fsanitize=address,undefined -Wall -Wextra tools/test_argv_dedup.cpp -o /tmp/test_argv_dedup
          /tmp/test_argv_dedup
          rm -f /tmp/test_argv_dedup
          echo "[CI] Pre-flight handoff test PASSED with 0 sanitize violations."

      - name: Configure CMake for iOS (arm64 Native)
        run: |
          cd ios
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export CXX="$(xcrun --sdk iphoneos --find clang++)"
          export OBJC="${CC}"
          export OBJCXX="${CXX}"
          cmake --preset ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.3 \
            -DREX_PLATFORM_IOS=1 \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_OBJC_COMPILER="${CC}" \
            -DCMAKE_OBJCXX_COMPILER="${CXX}" \
            -DCMAKE_ASM_COMPILER="${CC}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Compile and Package IPA
        run: |
          touch ios/src/ios_main.mm
          cd ios
          cmake --build --preset ios --target ipa -- -j 4 || {
            echo "[CI] Build failed! Re-running failed file with single-job diagnostics..."
            cmake --build --preset ios --target ipa -v -- -j 1
            exit 1
          }

      - name: Mandatory CI Pre-Upload Verification Gate
        run: |
          IPA_PATH="ios/build/FNCReborn-iOS-unsigned.ipa"
          if [ ! -f "${IPA_PATH}" ]; then
            IPA_PATH="ios/build/FNCReborn.ipa"
          fi
          if [ ! -f "${IPA_PATH}" ]; then
            echo "[CI Gate] FATAL: IPA not found!"
            exit 1
          fi

          IPA_CONTENTS_SIZE=$(unzip -l "${IPA_PATH}" | awk '/^[[:space:]]*[0-9]+[[:space:]]/ { total += $1 } END { print total + 0 }')
          echo "[CI Gate] Uncompressed IPA contents: ${IPA_CONTENTS_SIZE} bytes"
          if [ "${IPA_CONTENTS_SIZE}" -lt 83886080 ]; then
            echo "[CI Gate] FATAL: uncompressed IPA contents are less than 80 MB (${IPA_CONTENTS_SIZE} bytes)! Recompilation files or frameworks may be missing!"
            exit 1
          fi

          echo "[CI Gate] Verifying binary execution permissions in IPA:"
          zipinfo -l "${IPA_PATH}" | grep -E "Payload/FNCReborn.app/FNCReborn|Payload/FNCReborn.app/Frameworks/"

          echo "[CI Gate] Checking for AppIcon and prewarmed shader cache inside IPA:"
          unzip -l "${IPA_PATH}" | grep -E "AppIcon|45410915.fbo.vkcache|FNCShaders.metallib"

          mkdir -p dist
          cp -f "${IPA_PATH}" dist/FNCReborn-iOS-unsigned.ipa
          cd dist
          shasum -a 256 FNCReborn-iOS-unsigned.ipa > SHA256SUMS.txt
          echo "[CI Gate] Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNCReborn-iOS-unsigned-ipa
          path: |
            dist/FNCReborn-iOS-unsigned.ipa
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FNCReborn-iOS-unsigned.ipa
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
