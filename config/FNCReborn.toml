# FNC Reborn settings for iOS (Xbox 360 Title ID: 45410915).
# Optimized for Metal/Vulkan translator layer (librexgpu-xenos).

gpu_plugin = "xenos"
gpu_backend = "vulkan"
render_target_path_vulkan = "fbo"
log_level = "info"
log_file = "fnc.log"
async_shader_compilation = false

# Frame rate cap: 30 (original console), 60 (smooth default), 120 (Apple ProMotion)
fnc_frame_rate = 60
vsync = false
fullscreen = true
resolution_scale = 1
swap_post_effect = "fxaa"

# Graphics & Rendering fixes for Fight Night Champion
gpu_allow_invalid_fetch_constants = false
clear_memory_page_state = true
use_fuzzy_alpha_epsilon = true
gamma_render_target_as_unorm16 = true
native_2x_msaa = false
readback_resolve = "fast"
vulkan_readback_resolve = true
ios_readback_max_kb = 0
gpu_sin_msaa = true

# Texture cache limits in MB for iOS unified memory:
# Soft limit = 384 MB, Hard limit = 768 MB to prevent Metal OOM aborts.
texture_cache_memory_limit_soft = 384
texture_cache_memory_limit_hard = 768
texture_cache_memory_limit_render_to_texture = 128

# Camera & controls
fnc_fp_enable = true
fnc_view_boxer = 0
fnc_view_first_person = false
fnc_tp_back = 8.0
fnc_tp_height = 1.8
fnc_tp_side = 1.5
fnc_tp_fov = 0.8
fnc_tp_look_between = 0.65
fnc_tp_smooth = 0.85

fnc_fp_fov = 1.0
fnc_fp_forward = 0.35
fnc_fp_up = 0.05
fnc_fp_aim_drop = 0.4
fnc_fp_smooth = 0.5
